# ==============================================================================
# <ShopNest> Multi-Vendor E-Commerce Platform — Netlify Configuration
# ==============================================================================

[build]
  publish = "dist"
  command = "npm run build"

# Proxy all /api requests to Render backend (keeps cookies first-party)
# Replace YOUR-BACKEND with your actual Render service name
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
